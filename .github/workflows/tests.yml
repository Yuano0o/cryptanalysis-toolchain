name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run test suite
        # No dependency installation step: the suite is standard-library only.
        # Integration tests that need the upstream sources, a C++ compiler or
        # CryptoMiniSat skip themselves here rather than failing.
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v
