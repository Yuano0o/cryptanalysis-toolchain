<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="700" viewBox="0 0 1440 700" role="img" aria-labelledby="t d">
  <title id="t">The controlled boundary</title>
  <desc id="d">Upstream C++ programs stay read-only above a hash-verified boundary. Below it, an explicit request drives an instrumented temporary copy and produces a typed observation carrying provenance hashes, which an independent verifier re-checks.</desc>

  <defs>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#475569"/>
    </marker>
    <marker id="ag" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#059669"/>
    </marker>
    <marker id="ao" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#ea580c"/>
    </marker>
  </defs>

  <style>
    .f { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .h1 { font-size: 30px; font-weight: 700; fill: #0f172a; }
    .zone { font-size: 17px; font-weight: 700; letter-spacing: 1.4px; }
    .bt { font-size: 23px; font-weight: 700; fill: #0f172a; }
    .bd { font-size: 17px; fill: #334155; }
    .mu { font-size: 16px; fill: #64748b; }
    .chip { font-size: 15px; font-weight: 600; fill: #7c2d12; }
    .badge { font-size: 16px; font-weight: 700; fill: #ffffff; }
  </style>

  <rect width="1440" height="700" rx="28" fill="#f8fafc"/>
  <text x="720" y="54" text-anchor="middle" class="f h1">The controlled boundary</text>

  <!-- ================= UPSTREAM ZONE ================= -->
  <rect x="60" y="86" width="1320" height="182" rx="20" fill="#fffbeb" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="88" y="118" class="f zone" fill="#b45309">UPSTREAM REFERENCE SOURCES — NEVER MODIFIED</text>

  <g class="f">
    <g transform="translate(90 138)">
      <rect width="192" height="52" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
      <text x="96" y="32" text-anchor="middle" class="chip">1 · Trail search</text>
    </g>
    <g transform="translate(303 138)">
      <rect width="192" height="52" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
      <text x="96" y="32" text-anchor="middle" class="chip">2 · Linear constr.</text>
    </g>
    <g transform="translate(516 138)">
      <rect width="192" height="52" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
      <text x="96" y="32" text-anchor="middle" class="chip">3 · Linearised</text>
    </g>
    <g transform="translate(729 138)">
      <rect width="192" height="52" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
      <text x="96" y="32" text-anchor="middle" class="chip">4 · Fixed-key test</text>
    </g>
    <g transform="translate(942 138)">
      <rect width="192" height="52" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
      <text x="96" y="32" text-anchor="middle" class="chip">5 · Probability</text>
    </g>
    <g transform="translate(1155 138)">
      <rect width="192" height="52" rx="12" fill="#fef3c7" stroke="#fbbf24" stroke-width="2"/>
      <text x="96" y="32" text-anchor="middle" class="chip">6 · Coexistence</text>
    </g>
  </g>

  <text x="720" y="228" text-anchor="middle" class="f mu">Six C++ programs, 5,723 lines · parameters edited into the source · results copied between directories as .out files · <tspan font-style="italic">random_device</tspan> sampling</text>
  <text x="720" y="252" text-anchor="middle" class="f mu" font-weight="700" fill="#b45309">Not one line is changed</text>

  <!-- ================= BOUNDARY ================= -->
  <line x1="60" y1="308" x2="560" y2="308" stroke="#64748b" stroke-width="3" stroke-dasharray="12 8"/>
  <line x1="880" y1="308" x2="1380" y2="308" stroke="#64748b" stroke-width="3" stroke-dasharray="12 8"/>
  <g transform="translate(560 288)">
    <rect width="320" height="40" rx="20" fill="#475569"/>
    <text x="160" y="26" text-anchor="middle" class="f badge">SHA-256 pinned · checked per run</text>
  </g>

  <!-- subprocess arrows crossing the boundary -->
  <path d="M690 430 V330" stroke="#ea580c" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#ao)"/>
  <path d="M760 268 V424" stroke="#ea580c" stroke-width="3" fill="none" stroke-dasharray="8 6" marker-end="url(#ao)"/>
  <text x="960" y="362" text-anchor="middle" class="f mu" fill="#c2410c">subprocess · instrumented temporary copy</text>

  <!-- ================= TOOLCHAIN ZONE ================= -->
  <text x="88" y="392" class="f zone" fill="#1d4ed8">THE TOOLCHAIN</text>

  <g filter="url(#sh)" class="f">
    <g transform="translate(60 410)">
      <rect width="360" height="150" rx="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="3"/>
      <text x="26" y="46" class="bt">Request</text>
      <text x="26" y="82" class="bd">Explicit parameters and seed</text>
      <text x="26" y="110" class="bd">Per-sample and total budgets</text>
      <text x="26" y="136" class="mu">Versioned schema, frozen config</text>
    </g>

    <g transform="translate(540 410)">
      <rect width="360" height="150" rx="20" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="3"/>
      <text x="26" y="46" class="bt">Adapter</text>
      <text x="26" y="82" class="bd">Verifies the pinned hash first</text>
      <text x="26" y="110" class="bd">Replaces the entropy source</text>
      <text x="26" y="136" class="mu">Original tree is never written to</text>
    </g>

    <g transform="translate(1020 410)">
      <rect width="360" height="150" rx="20" fill="#ecfdf5" stroke="#10b981" stroke-width="3"/>
      <text x="26" y="46" class="bt">Observation</text>
      <text x="26" y="82" class="bd">Typed result, one of 11 schemas</text>
      <text x="26" y="110" class="bd">Source, stdout and fixture hashes</text>
      <text x="26" y="136" class="mu">Unfinished runs return no number</text>
    </g>
  </g>

  <g stroke="#475569" stroke-width="4" fill="none" marker-end="url(#a)">
    <path d="M420 485 H532"/>
    <path d="M900 485 H1012"/>
  </g>

  <!-- ================= VERIFIER ================= -->
  <g filter="url(#sh)" class="f">
    <g transform="translate(1020 606)">
      <rect width="360" height="72" rx="18" fill="#ffffff" stroke="#059669" stroke-width="3"/>
      <text x="26" y="32" class="bt" font-size="21">Independent verifier</text>
      <text x="26" y="56" class="mu">Shares no code with the encoder</text>
    </g>
  </g>
  <path d="M1200 602 V568" stroke="#059669" stroke-width="4" fill="none" marker-end="url(#ag)"/>

  <text x="60" y="650" class="f mu">106 regression tests · zero third-party dependencies · the same request reproduces the same result</text>
</svg>
